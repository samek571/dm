# Most course info lives in _data/course.yml – edit that first.

title: "Název předmětu – cvičení 2026/2027"
description: "Stránka cvičení: rozvrh, podmínky zápočtu, novinky a materiály."
lang: cs

# Must match the repository name: "/<repo-name>".
# If the repo is called <username>.github.io, use "" instead.
baseurl: "/dm"
url: ""

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax   # outputs \( \) / \[ \], rendered in the browser by KaTeX

plugins:
  - jekyll-feed          # RSS feed of the news at /feed.xml

permalink: /novinky/:year/:month/:day/:title/
exclude:
  - README.md
