<section id="novinky" class="block">
<div class="head"><h2>Novinky</h2></div>
{% if site.posts.size == 0 %}<p class="muted">Zatial nic.</p>{% endif %}
<ul class="news">
{% for post in site.posts limit: 5 %}
<li>
<time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d. %-m." }}</time>
<div>
<a class="title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
{% if post.excerpt %}<div class="excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</div>{% endif %}
</div>
</li>
{% endfor %}
</ul>
</section>
